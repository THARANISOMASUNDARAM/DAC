<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Home</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Barlow:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&family=Heebo:wght@100..900&family=Roboto:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="./css/custom.css">
</head>
<body>
    <header>
        <div class="flex-row justify-center align-center space-btw navbar-desktop">
        <div class="flex-row justify-center align-center g-10">
            <span class="logo flex-row">
                <img src="./assets/images/Logo.png" alt="Logo">
            </span>
            <span class="logo-name">
                <img src="./assets/images/square_up.png" alt="Logo">
            </span>
        </div>
        <div class="flex-row f-18 g-30 t-white">
            <p>Home</p>
            <p>Services</p>
            <p>Work</p>
            <p>Process</p>
            <p>About</p>
            <p>Careers</p>
        </div>
        <button class="btn-primary f-18">
            Contact Us
        </button>
        </div>
        <div class="navbar-mobile">

        </div>
    </header>
    <main>
        <section class="flex-col align-center hero">
            <div class="flex-col g-30" style="margin-top:40px;">
                <h1 class="f-68 t-white text-center" >A Digital Product Studio that will Work</h1>
                <div class="flex-row align-center justify-center">
                    <p class="flex-row g-6 f-22 t-gray align-center justify-center" 
                        >
                        For <span class="highlight f-22 t-white">Startups</span> , 
                        <span class="highlight f-22 t-white">Enterprise leaders</span> , 
                        <span class="highlight f-22 t-white">Media & Publishers</span> and 
                        <span class="highlight f-22 t-white">Social Good</span></p>
                </div>
                <div class="flex-row g-13 justify-center">
                    <button class="btn-secondary f-18 t-white">Our Works</button>
                    <button class="btn-primary f-18">Contact Us</button>
                 </div>
            </div>
        </section>
        <section class="flex-row testimonials justify-evenly g-20"> 
            <img src="./assets/images/zapier.png" alt="">
            <img src="./assets/images/spotify.png" alt="">
            <img src="./assets/images/zoom.png" alt="">
            <img src="./assets/images/slack.png" alt="">
            <img src="./assets/images/amazon.png" alt="">
            <img src="./assets/images/adobe.png" alt="">
            <div class="badge f-18 t-white">
                Trusted By 250+ Companies 
            </div>
        </section>
        <section class="grid-2 testimonials-mobile justify-evenly g-20"> 
            <img src="./assets/images/zapier.png" alt="">
            <img src="./assets/images/spotify.png" alt="">
            <img src="./assets/images/zoom.png" alt="">
            <img src="./assets/images/slack.png" alt="">
            <img src="./assets/images/amazon.png" alt="">
            <img src="./assets/images/adobe.png" alt="">
            <div class="badge f-18 t-white">
                Trusted By 250+ Companies 
            </div>
        </section>
    </main>
</body>
</html>
